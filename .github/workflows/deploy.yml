name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build bundle
        run: npm run build

      - name: Prepare dist folder
        run: |
          mkdir -p dist
          # Worker de @thatopen/fragments
          find node_modules/@thatopen/fragments -name "worker.mjs" -exec cp {} dist/ \; 2>/dev/null || true
          # WASM files
          find node_modules -name "*.wasm" -path "*/web-ifc/*" -exec cp {} dist/ \; 2>/dev/null || true
          find node_modules/@thatopen/fragments -name "*.wasm" -exec cp {} dist/ \; 2>/dev/null || true
          # Assets
          cp index.html dist/
          cp -r data    dist/
          cp -r models  dist/
          echo "=== dist/ ===" && ls -la dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

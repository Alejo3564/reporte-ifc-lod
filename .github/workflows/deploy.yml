name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Copy WASM files
        run: |
          mkdir -p dist/wasm
          cp node_modules/web-ifc/*.wasm dist/wasm/
          cp node_modules/web-ifc/*.js   dist/wasm/ 2>/dev/null || true

      - name: Copy static assets
        run: |
          cp index.html dist/
          cp -r data     dist/
          cp -r models   dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

name: Build and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build bundle
        run: npm run build

      - name: Prepare dist folder
        run: |
          # Worker de @thatopen/fragments (requerido para procesar IFC en background)
          mkdir -p dist
          cp node_modules/@thatopen/fragments/dist/Worker/worker.mjs dist/ 2>/dev/null || true
          # WASM de web-ifc (dentro de @thatopen/fragments o directo)
          cp node_modules/@thatopen/fragments/dist/*.wasm dist/ 2>/dev/null || true
          cp node_modules/web-ifc/*.wasm dist/ 2>/dev/null || true
          # Assets estáticos
          cp index.html dist/
          cp -r data    dist/
          cp -r models  dist/
          echo "=== Contenido de dist/ ===" && ls -la dist/

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Reporte IFC LOD</title>

<style>

body {
    font-family: Arial;
    margin: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
}

.viewer {
    width: 400px;
    height: 300px;
    border: 1px solid #999;
}

#propiedades {
    margin-top: 20px;
    padding: 10px;
    border: 1px solid #999;
    width: 400px;
}

.filtros {
    margin-bottom: 15px;
}

.filtros input {
    margin-right: 10px;
    padding: 5px;
}

</style>

</head>

<body>

<h2>Reporte LOD Objetos IFC</h2>


<div class="filtros">

<label>Buscar Código:</label>
<input type="text" id="filtroCodigo" onkeyup="filtrar()">

<label>Buscar Elemento:</label>
<input type="text" id="filtroElemento" onkeyup="filtrar()">

<label>Buscar IFC Type:</label>
<input type="text" id="filtroIfcType" onkeyup="filtrar()">

</div>


<table id="tabla">

<thead>
<tr>
<th>Codigo</th>
<th>Elemento</th>
<th>IFC Type</th>
<th>Descripción</th>
<th>LOD</th>
<th>Modelo IFC</th>
</tr>
</thead>

<tbody id="tablaBody"></tbody>

</table>


<h3>Propiedades del elemento seleccionado</h3>
<div id="propiedades">
IfcType: <span id="ifcType">Ninguno</span>
</div>


<script type="module">

import {
    Viewer,
    XKTLoaderPlugin
} from "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk/dist/xeokit-sdk.es.js";


let datosGlobal = [];


async function iniciar()
{

    const response = await fetch("./data/datos.json?v=" + Date.now());

    datosGlobal = await response.json();

    renderTabla(datosGlobal);

}


function renderTabla(datos)
{

    const tabla = document.getElementById("tablaBody");

    tabla.innerHTML = "";

    datos.forEach((item, index) => {

        const canvasId = "viewer_" + index;

        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${item.codigo}</td>
            <td>${item.elemento}</td>
            <td>${item.ifc_type}</td>
            <td>${item.descripcion}</td>
            <td>${item.lod}</td>
            <td><canvas id="${canvasId}" class="viewer"></canvas></td>
        `;

        tabla.appendChild(fila);

        crearViewer(canvasId, item.ifc_path);

    });

}


function crearViewer(canvasId, xktPath)
{

    const viewer = new Viewer({
        canvasId: canvasId
    });

    const loader = new XKTLoaderPlugin(viewer);

    const model = loader.load({
        src: xktPath,
        edges: true
    });

    model.on("loaded", () => {

        viewer.cameraFlight.flyTo({
            aabb: viewer.scene.aabb
        });

    });

    viewer.scene.input.on("mouseclicked", (coords) => {

        const hit = viewer.scene.pick({
            canvasPos: coords
        });

        if (hit && hit.entity)
        {
            const entity = hit.entity;

            const ifcType = entity.metaObject?.type || "No disponible";

            document.getElementById("ifcType").innerText = ifcType;
        }

    });

}


window.filtrar = function()
{

    const codigo = document.getElementById("filtroCodigo").value.toLowerCase();

    const elemento = document.getElementById("filtroElemento").value.toLowerCase();

    const ifcType = document.getElementById("filtroIfcType").value.toLowerCase();


    const filtrados = datosGlobal.filter(item =>
        item.codigo.toLowerCase().includes(codigo) &&
        item.elemento.toLowerCase().includes(elemento) &&
        item.ifc_type.toLowerCase().includes(ifcType)
    );

    renderTabla(filtrados);

}


iniciar();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte IFC LOD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
  :root {
    --bg:#0f1117; --surface:#1a1d27; --surface2:#222636; --border:#2e3347;
    --accent:#3b82f6; --accent2:#10b981; --text:#e2e8f0; --muted:#64748b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;gap:16px}
  header .logo{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:2px;text-transform:uppercase}
  header h1{font-size:17px;font-weight:600;letter-spacing:-.3px}
  header .sep{width:1px;height:22px;background:var(--border)}
  .main{padding:28px 32px;max-width:1600px;margin:0 auto}
  .filtros-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:20px}
  .fg{display:flex;flex-direction:column;gap:4px}
  .fg label{font-size:10px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .fg select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:5px;font-size:13px;cursor:pointer;min-width:130px;outline:none}
  .fg select:focus{border-color:var(--accent)}
  .btn-clear{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:5px;font-size:12px;cursor:pointer}
  .btn-clear:hover{border-color:var(--accent);color:var(--accent)}
  .count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
  .table-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  table{border-collapse:collapse;width:100%}
  thead{background:var(--surface2);border-bottom:2px solid var(--border)}
  th{padding:12px 16px;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);white-space:nowrap}
  tbody tr{border-bottom:1px solid var(--border);transition:background .1s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:var(--surface2)}
  td{padding:14px 16px;font-size:13px;vertical-align:middle}
  td.cod{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent)}
  td.itype{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent2)}
  .lod{display:inline-block;padding:2px 8px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600}
  .lod-200{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
  .lod-300{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.3)}
  .lod-400{background:rgba(59,130,246,.12);color:#3b82f6;border:1px solid rgba(59,130,246,.3)}
  .lod-500{background:rgba(168,85,247,.12);color:#a855f7;border:1px solid rgba(168,85,247,.3)}
  .vc{width:380px;padding:10px 16px}
  .vbox{position:relative;width:350px;height:240px;border-radius:6px;overflow:hidden;background:#080a12;border:1px solid var(--border)}
  .vbox canvas{width:100%!important;height:100%!important;display:block}
  .vload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#080a12;z-index:10;transition:opacity .4s}
  .vload.gone{opacity:0;pointer-events:none}
  .spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  .vload span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:1px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .props{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:20px}
  .props h3{font-size:10px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:14px}
  .pg{display:flex;gap:32px;flex-wrap:wrap}
  .pi{display:flex;flex-direction:column;gap:4px}
  .pl{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .pv{font-size:14px;font-weight:500}
  .pv.m{font-family:'IBM Plex Mono',monospace;color:var(--accent2)}
  .empty{padding:48px;text-align:center;color:var(--muted);font-size:13px;display:none}
</style>
</head>
<body>

<header>
  <div class="logo">BIM Smart Tools</div>
  <div class="sep"></div>
  <h1>Reporte LOD — Objetos IFC</h1>
</header>

<div class="main">
  <div class="filtros-bar">
    <div class="fg"><label>Código</label><select id="fCod" onchange="filtrar()"><option value="">Todos</option></select></div>
    <div class="fg"><label>Elemento</label><select id="fEle" onchange="filtrar()"><option value="">Todos</option></select></div>
    <div class="fg"><label>IFC Type</label><select id="fIfc" onchange="filtrar()"><option value="">Todos</option></select></div>
    <div class="fg"><label>LOD</label><select id="fLod" onchange="filtrar()"><option value="">Todos</option></select></div>
    <button class="btn-clear" onclick="limpiar()">✕ Limpiar</button>
    <span class="count" id="cnt"></span>
  </div>
  <div class="table-wrapper">
    <table>
      <thead><tr><th>Código</th><th>Elemento</th><th>IFC Type</th><th>Descripción</th><th>LOD</th><th>Modelo 3D (IFC)</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty">No hay resultados.</div>
  </div>
  <div class="props">
    <h3>Elemento seleccionado</h3>
    <div class="pg">
      <div class="pi"><span class="pl">IFC Type</span><span class="pv m" id="pType">—</span></div>
      <div class="pi"><span class="pl">Nombre</span><span class="pv" id="pNom">—</span></div>
      <div class="pi"><span class="pl">Express ID</span><span class="pv" id="pId">—</span></div>
    </div>
  </div>
</div>

<!--
  ESTRATEGIA CDN:
  - Three.js r152 desde jsDelivr (CORS abierto, ES module)
  - IFCLoader desde jsDelivr (mismo bundle de Three.js examples, compatible 100%)
  - web-ifc WASM desde jsDelivr (misma versión que usa IFCLoader de Three r152: 0.0.44)
  - Sin importmap necesario: todas las rutas son absolutas
-->
<script type="module">

// Three.js core + addons desde jsDelivr — CORS garantizado
const THREE_BASE = "https://cdn.jsdelivr.net/npm/three@0.152.2";

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js";

const { OrbitControls } = await import(
  "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/controls/OrbitControls.js"
);
const { IFCLoader } = await import(
  "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/loaders/IFCLoader.js"
);

// WASM de web-ifc — versión que viene empaquetada con three r152
const WASM_PATH = "https://cdn.jsdelivr.net/npm/web-ifc@0.0.44/";

// ─── ESTADO ──────────────────────────────────────────────────────────────────
let datos = [];
const viewers = {};

// ─── INICIAR ─────────────────────────────────────────────────────────────────
async function iniciar() {
  const r = await fetch("./data/datos.json?v=" + Date.now());
  datos = await r.json();
  llenarDropdowns();
  renderTabla(datos);
}

// ─── DROPDOWNS ───────────────────────────────────────────────────────────────
function llenarDropdowns() {
  dd("fCod", [...new Set(datos.map(x => x.codigo))]);
  dd("fEle", [...new Set(datos.map(x => x.elemento))]);
  dd("fIfc", [...new Set(datos.map(x => x.ifc_type))]);
  dd("fLod", [...new Set(datos.map(x => x.lod))]);
}
function dd(id, vals) {
  const s = document.getElementById(id);
  vals.sort().forEach(v => {
    const o = document.createElement("option");
    o.value = o.text = v;
    s.appendChild(o);
  });
}

// ─── RENDER TABLA ─────────────────────────────────────────────────────────────
function renderTabla(d) {
  const tb = document.getElementById("tbody");
  document.getElementById("empty").style.display = d.length === 0 ? "block" : "none";
  document.getElementById("cnt").textContent = `${d.length} elemento${d.length !== 1 ? "s" : ""}`;

  // Limpiar viewers anteriores
  Object.values(viewers).forEach(v => {
    cancelAnimationFrame(v.raf);
    v.renderer.dispose();
  });
  Object.keys(viewers).forEach(k => delete viewers[k]);
  tb.innerHTML = "";

  d.forEach((item, i) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="cod">${item.codigo}</td>
      <td>${item.elemento}</td>
      <td class="itype">${item.ifc_type}</td>
      <td>${item.descripcion}</td>
      <td><span class="lod lod-${item.lod}">LOD ${item.lod}</span></td>
      <td class="vc">
        <div class="vbox" id="vbox_${i}">
          <canvas id="cv_${i}"></canvas>
          <div class="vload" id="vload_${i}">
            <div class="spin"></div>
            <span>Cargando IFC…</span>
          </div>
        </div>
      </td>`;
    tb.appendChild(tr);
    // Escalonar carga para no saturar el hilo principal
    setTimeout(() => crearViewer(i, item.ifc_path), 100 + i * 200);
  });
}

// ─── VISOR IFC ────────────────────────────────────────────────────────────────
async function crearViewer(i, ifcPath) {
  const box    = document.getElementById(`vbox_${i}`);
  const canvas = document.getElementById(`cv_${i}`);
  if (!box || !canvas) return;

  const W = box.clientWidth  || 350;
  const H = box.clientHeight || 240;

  // Renderer
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x080a12, 1);

  // Scene
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));
  const dir = new THREE.DirectionalLight(0xffffff, 1.5);
  dir.position.set(50, 100, 50);
  scene.add(dir);
  const dir2 = new THREE.DirectionalLight(0x8888ff, 0.4);
  dir2.position.set(-50, -20, -50);
  scene.add(dir2);

  // Camera + Controls
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.01, 100000);
  camera.position.set(10, 10, 10);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;

  // Render loop
  const state = { renderer, raf: null };
  viewers[`cv_${i}`] = state;
  (function loop() {
    state.raf = requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();

  // IFCLoader (Three.js oficial r152) — misma versión de three en CDN
  const ifcLoader = new IFCLoader();
  await ifcLoader.ifcManager.setWasmPath(WASM_PATH);

  // Cargar modelo IFC
  try {
    ifcLoader.load(
      ifcPath,
      (model) => {
        scene.add(model);

        // Centrar cámara
        const bbox   = new THREE.Box3().setFromObject(model);
        const center = bbox.getCenter(new THREE.Vector3());
        const size   = bbox.getSize(new THREE.Vector3());
        const dist   = Math.max(size.x, size.y, size.z) * 1.8;
        camera.position.set(
          center.x + dist,
          center.y + dist * 0.7,
          center.z + dist
        );
        controls.target.copy(center);
        controls.update();

        // Ocultar spinner
        document.getElementById(`vload_${i}`)?.classList.add("gone");

        // Raycaster para selección de elementos
        const raycaster = new THREE.Raycaster();
        raycaster.firstHitOnly = true;
        const mouse = new THREE.Vector2();

        canvas.addEventListener("click", async (e) => {
          const rect = canvas.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width)  *  2 - 1;
          mouse.y = ((e.clientY - rect.top)  / rect.height) * -2 + 1;
          raycaster.setFromCamera(mouse, camera);

          const hits = raycaster.intersectObjects(scene.children, true);
          if (hits.length > 0) {
            const hit = hits[0];
            try {
              const faceIdx = hit.faceIndex;
              const modelID = hit.object.modelID ?? 0;
              const expressID = ifcLoader.ifcManager.getExpressId(hit.object.geometry, faceIdx);
              const props = await ifcLoader.ifcManager.getItemProperties(modelID, expressID);
              document.getElementById("pType").textContent = props?.type     || "—";
              document.getElementById("pNom").textContent  = props?.Name?.value || "—";
              document.getElementById("pId").textContent   = expressID;
            } catch(err) {
              console.warn("Props error:", err);
            }
          }
        });
      },
      undefined,
      (err) => {
        console.error(`IFC load error [${ifcPath}]:`, err);
        const vl = document.getElementById(`vload_${i}`);
        if (vl) vl.innerHTML = `<span style="color:#ef4444;font-size:10px;font-family:'IBM Plex Mono',monospace;text-align:center;padding:8px">Error al cargar<br><b>${ifcPath.split("/").pop()}</b></span>`;
      }
    );
  } catch(e) {
    console.error(e);
  }
}

// ─── FILTROS ─────────────────────────────────────────────────────────────────
window.filtrar = () => {
  const c = document.getElementById("fCod").value;
  const e = document.getElementById("fEle").value;
  const t = document.getElementById("fIfc").value;
  const l = document.getElementById("fLod").value;
  renderTabla(datos.filter(x =>
    (!c || x.codigo   === c) &&
    (!e || x.elemento === e) &&
    (!t || x.ifc_type === t) &&
    (!l || x.lod      === l)
  ));
};
window.limpiar = () => {
  ["fCod","fEle","fIfc","fLod"].forEach(id => document.getElementById(id).value = "");
  renderTabla(datos);
};

iniciar();
</script>
</body>
</html>

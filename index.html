<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Reporte IFC LOD</title>

<style>

body {
    font-family: Arial;
    margin: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
}

.viewer {
    width: 350px;
    height: 250px;
}

</style>

</head>

<body>

<h2>Reporte LOD Objetos IFC</h2>

<table>

<thead>

<tr>
<th>Codigo</th>
<th>Elemento</th>
<th>IFC Type</th>
<th>Descripción</th>
<th>LOD</th>
<th>Modelo IFC</th>
</tr>

</thead>

<tbody id="tabla"></tbody>

</table>


<script type="module">

import * as THREE from "https://unpkg.com/three@0.152.2/build/three.module.js";

import { IFCViewerAPI }
from "https://unpkg.com/web-ifc-viewer@latest/dist/IFCViewerAPI.js";


async function iniciar()
{

    const tabla = document.getElementById("tabla");

    const response = await fetch("./data/datos.json");

    const datos = await response.json();

    datos.forEach((item, index) => {

        const viewerId = "viewer_" + index;

        const fila = document.createElement("tr");

        fila.innerHTML = `

            <td>${item.codigo}</td>
            <td>${item.elemento}</td>
            <td>${item.ifc_type}</td>
            <td>${item.descripcion}</td>
            <td>${item.lod}</td>
            <td>
                <div id="${viewerId}" class="viewer"></div>
            </td>
        `;

        tabla.appendChild(fila);

        crearViewer(viewerId, item.ifc_path);

    });

}


function crearViewer(containerId, ifcPath)
{

    const container = document.getElementById(containerId);

    const viewer = new IFCViewerAPI({
        container: container,
        backgroundColor: new THREE.Color(0xffffff)
    });

    viewer.axes.setAxes();
    viewer.grid.setGrid();

    viewer.IFC.loadIfcUrl(ifcPath);

}


iniciar();

</script>


</body>
</html>

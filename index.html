<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte IFC LOD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');
  :root{--bg:#0f1117;--surface:#1a1d27;--surface2:#222636;--border:#2e3347;--accent:#3b82f6;--accent2:#10b981;--text:#e2e8f0;--muted:#64748b}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'IBM Plex Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;gap:16px}
  .logo{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);letter-spacing:2px;text-transform:uppercase}
  header h1{font-size:17px;font-weight:600}
  .sep{width:1px;height:22px;background:var(--border)}
  .main{padding:28px 32px;max-width:1600px;margin:0 auto}
  .filtros-bar{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:20px}
  .fg{display:flex;flex-direction:column;gap:4px}
  .fg label{font-size:10px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
  .fg select{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:7px 10px;border-radius:5px;font-size:13px;cursor:pointer;min-width:130px;outline:none}
  .btn-clear{background:transparent;border:1px solid var(--border);color:var(--muted);padding:7px 14px;border-radius:5px;font-size:12px;cursor:pointer}
  .btn-clear:hover{border-color:var(--accent);color:var(--accent)}
  .count{margin-left:auto;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
  .table-wrapper{background:var(--surface);border:1px solid var(--border);border-radius:8px;overflow:hidden}
  table{border-collapse:collapse;width:100%}
  thead{background:var(--surface2);border-bottom:2px solid var(--border)}
  th{padding:12px 16px;text-align:left;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);white-space:nowrap}
  tbody tr{border-bottom:1px solid var(--border)}
  tbody tr:hover{background:var(--surface2)}
  td{padding:14px 16px;font-size:13px;vertical-align:middle}
  td.cod{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent)}
  td.itype{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent2)}
  .lod{display:inline-block;padding:2px 8px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600}
  .lod-200{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.3)}
  .lod-300{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.3)}
  .lod-400{background:rgba(59,130,246,.12);color:#3b82f6;border:1px solid rgba(59,130,246,.3)}
  .lod-500{background:rgba(168,85,247,.12);color:#a855f7;border:1px solid rgba(168,85,247,.3)}
  .vc{width:380px;padding:10px 16px}
  .vbox{position:relative;width:350px;height:240px;border-radius:6px;overflow:hidden;background:#080a12;border:1px solid var(--border)}
  .vbox canvas{width:100%!important;height:100%!important;display:block}
  .vload{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#080a12;z-index:10;transition:opacity .4s}
  .vload.gone{opacity:0;pointer-events:none}
  .spin{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
  .vload span{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--muted)}
  @keyframes spin{to{transform:rotate(360deg)}}
  .props{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:20px;margin-top:20px}
  .props h3{font-size:10px;font-family:'IBM Plex Mono',monospace;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:14px}
  .pg{display:flex;gap:32px;flex-wrap:wrap}
  .pi{display:flex;flex-direction:column;gap:4px}
  .pl{font-size:10px;font-family:'IBM Plex Mono',monospace;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
  .pv{font-size:14px;font-weight:500}
  .pv.m{font-family:'IBM Plex Mono',monospace;color:var(--accent2)}
  .empty{padding:48px;text-align:center;color:var(--muted);font-size:13px;display:none}
</style>
</head>
<body>

<header>
  <div class="logo">BIM Smart Tools</div>
  <div class="sep"></div>
  <h1>Reporte LOD — Objetos IFC</h1>
</header>

<div class="main">
  <div class="filtros-bar">
    <div class="fg"><label>Codigo</label><select id="fCod" onchange="filtrar()"><option value="">Todos</option></select></div>
    <div class="fg"><label>Elemento</label><select id="fEle" onchange="filtrar()"><option value="">Todos</option></select></div>
    <div class="fg"><label>IFC Type</label><select id="fIfc" onchange="filtrar()"><option value="">Todos</option></select></div>
    <div class="fg"><label>LOD</label><select id="fLod" onchange="filtrar()"><option value="">Todos</option></select></div>
    <button class="btn-clear" onclick="limpiar()">x Limpiar</button>
    <span class="count" id="cnt"></span>
  </div>
  <div class="table-wrapper">
    <table>
      <thead><tr><th>Codigo</th><th>Elemento</th><th>IFC Type</th><th>Descripcion</th><th>LOD</th><th>Modelo 3D (IFC)</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty">No hay resultados.</div>
  </div>
  <div class="props">
    <h3>Elemento seleccionado</h3>
    <div class="pg">
      <div class="pi"><span class="pl">IFC Type</span><span class="pv m" id="pType">-</span></div>
      <div class="pi"><span class="pl">Nombre</span><span class="pv" id="pNom">-</span></div>
      <div class="pi"><span class="pl">Express ID</span><span class="pv" id="pId">-</span></div>
    </div>
  </div>
</div>

<!-- 
  Versiones exactamente compatibles entre sí:
  - three@0.135.0  (la que usa web-ifc-three como peer dep)
  - web-ifc-three@0.0.117 (UMD → expone window.IFCLoader = { IFCLoader: ... })
  - web-ifc@0.0.44 (la que incluye web-ifc-three@0.0.117)
-->
<script src="https://cdn.jsdelivr.net/npm/three@0.135.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.135.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/web-ifc-three@0.0.117/IFCLoader.js"></script>

<script>
// El UMD de web-ifc-three@0.0.117 expone: window.IFCLoader = { IFCLoader: class }
// Verificamos todas las posibles ubicaciones por si cambia entre versiones
var IFCLoader = (window.IFCLoader && window.IFCLoader.IFCLoader)  // UMD normal
             || window.IFCLoaderLib                                 // fallback
             || (window.WebIFCThree && window.WebIFCThree.IFCLoader); // otro fallback

var WASM_PATH = "https://cdn.jsdelivr.net/npm/web-ifc@0.0.44/";

var datos   = [];
var viewers = {};

function iniciar() {
  fetch("./data/datos.json?v=" + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      datos = d;
      llenarDropdowns();
      renderTabla(datos);
    })
    .catch(function(e){ console.error("Error cargando datos.json:", e); });
}

function llenarDropdowns() {
  dd("fCod", uniq(datos.map(function(x){ return x.codigo; })));
  dd("fEle", uniq(datos.map(function(x){ return x.elemento; })));
  dd("fIfc", uniq(datos.map(function(x){ return x.ifc_type; })));
  dd("fLod", uniq(datos.map(function(x){ return x.lod; })));
}
function uniq(arr){ return arr.filter(function(v,i,a){ return a.indexOf(v)===i; }).sort(); }
function dd(id, vals) {
  var s = document.getElementById(id);
  vals.forEach(function(v){
    var o = document.createElement("option");
    o.value = o.text = v;
    s.appendChild(o);
  });
}

function renderTabla(d) {
  var tb = document.getElementById("tbody");
  document.getElementById("empty").style.display = d.length === 0 ? "block" : "none";
  document.getElementById("cnt").textContent = d.length + " elemento" + (d.length !== 1 ? "s" : "");

  Object.keys(viewers).forEach(function(k){
    cancelAnimationFrame(viewers[k].raf);
    viewers[k].renderer.dispose();
  });
  viewers = {};
  tb.innerHTML = "";

  d.forEach(function(item, i) {
    var tr = document.createElement("tr");
    tr.innerHTML =
      "<td class='cod'>"   + item.codigo      + "</td>" +
      "<td>"               + item.elemento    + "</td>" +
      "<td class='itype'>" + item.ifc_type    + "</td>" +
      "<td>"               + item.descripcion + "</td>" +
      "<td><span class='lod lod-" + item.lod + "'>LOD " + item.lod + "</span></td>" +
      "<td class='vc'>" +
        "<div class='vbox' id='vbox_" + i + "'>" +
          "<canvas id='cv_" + i + "'></canvas>" +
          "<div class='vload' id='vload_" + i + "'>" +
            "<div class='spin'></div>" +
            "<span>Cargando IFC...</span>" +
          "</div>" +
        "</div>" +
      "</td>";
    tb.appendChild(tr);
    setTimeout(function(){ crearViewer(i, item.ifc_path); }, 100 + i * 300);
  });
}

function crearViewer(i, ifcPath) {
  var box    = document.getElementById("vbox_" + i);
  var canvas = document.getElementById("cv_"   + i);
  if (!box || !canvas) return;

  // Verificacion de seguridad: IFCLoader debe estar disponible
  if (!IFCLoader) {
    console.error("IFCLoader no disponible. window.IFCLoader =", window.IFCLoader);
    var vl = document.getElementById("vload_" + i);
    if (vl) vl.innerHTML = "<span style='color:#ef4444;font-size:10px;text-align:center;padding:8px'>IFCLoader no cargado</span>";
    return;
  }

  var W = box.clientWidth  || 350;
  var H = box.clientHeight || 240;

  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setClearColor(0x080a12, 1);

  var scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  var dir = new THREE.DirectionalLight(0xffffff, 1.4);
  dir.position.set(50, 100, 50);
  scene.add(dir);

  var camera = new THREE.PerspectiveCamera(45, W / H, 0.01, 100000);
  camera.position.set(10, 10, 10);

  var controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  var state = { renderer: renderer, raf: null };
  viewers["cv_" + i] = state;
  (function loop(){
    state.raf = requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();

  var loader = new IFCLoader();
  loader.ifcManager.setWasmPath(WASM_PATH).then(function(){
    loader.load(
      ifcPath,
      function(model) {
        scene.add(model);
        var bbox   = new THREE.Box3().setFromObject(model);
        var center = bbox.getCenter(new THREE.Vector3());
        var size   = bbox.getSize(new THREE.Vector3());
        var dist   = Math.max(size.x, size.y, size.z) * 1.8;
        camera.position.set(center.x + dist, center.y + dist * 0.7, center.z + dist);
        controls.target.copy(center);
        controls.update();

        var vl = document.getElementById("vload_" + i);
        if (vl) vl.classList.add("gone");

        var raycaster = new THREE.Raycaster();
        raycaster.firstHitOnly = true;
        var mouse = new THREE.Vector2();
        canvas.addEventListener("click", function(e) {
          var rect = canvas.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / rect.width)  *  2 - 1;
          mouse.y = ((e.clientY - rect.top)  / rect.height) * -2 + 1;
          raycaster.setFromCamera(mouse, camera);
          var hits = raycaster.intersectObjects(scene.children, true);
          if (hits.length > 0) {
            var hit = hits[0];
            try {
              var expressID = loader.ifcManager.getExpressId(hit.object.geometry, hit.faceIndex);
              var modelID   = (hit.object.modelID != null) ? hit.object.modelID : 0;
              loader.ifcManager.getItemProperties(modelID, expressID).then(function(props) {
                document.getElementById("pType").textContent = (props && props.type) ? props.type : "-";
                document.getElementById("pNom").textContent  = (props && props.Name && props.Name.value) ? props.Name.value : "-";
                document.getElementById("pId").textContent   = expressID;
              });
            } catch(e2){ console.warn(e2); }
          }
        });
      },
      undefined,
      function(err) {
        console.error("Error IFC:", ifcPath, err);
        var vl = document.getElementById("vload_" + i);
        if (vl) vl.innerHTML = "<span style='color:#ef4444;font-size:10px;text-align:center;padding:8px'>Error cargando<br>" + ifcPath.split("/").pop() + "</span>";
      }
    );
  });
}

function filtrar() {
  var c = document.getElementById("fCod").value;
  var e = document.getElementById("fEle").value;
  var t = document.getElementById("fIfc").value;
  var l = document.getElementById("fLod").value;
  renderTabla(datos.filter(function(x){
    return (!c||x.codigo===c)&&(!e||x.elemento===e)&&(!t||x.ifc_type===t)&&(!l||x.lod===l);
  }));
}
function limpiar() {
  ["fCod","fEle","fIfc","fLod"].forEach(function(id){ document.getElementById(id).value=""; });
  renderTabla(datos);
}

// Esperar a que todos los scripts UMD hayan cargado antes de iniciar
window.addEventListener("load", function() {
  // Debug: mostrar qué expone window.IFCLoader
  console.log("window.IFCLoader:", window.IFCLoader);
  // Re-resolver IFCLoader después de que todos los scripts cargaron
  IFCLoader = (window.IFCLoader && window.IFCLoader.IFCLoader)
           || window.IFCLoaderLib
           || (window.WebIFCThree && window.WebIFCThree.IFCLoader);
  console.log("IFCLoader resuelto:", IFCLoader);
  iniciar();
});
</script>
</body>
</html>

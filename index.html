<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Reporte IFC LOD</title>

<style>

body {
    font-family: Arial;
    margin: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
}

.viewer {
    width: 400px;
    height: 300px;
}

</style>

</head>

<body>

<h2>Reporte LOD Objetos IFC</h2>

<table>

<thead>
<tr>
<th>Codigo</th>
<th>Elemento</th>
<th>IFC Type</th>
<th>Descripción</th>
<th>LOD</th>
<th>Modelo IFC</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>


<script type="module">

import {Viewer} from "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk/dist/xeokit-sdk.es.js";

import {XKTLoaderPlugin} from "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk/dist/xeokit-sdk.es.js";

async function iniciar()
{

    const tabla = document.getElementById("tabla");

    const response = await fetch("./data/datos.json");

    const datos = await response.json();

    datos.forEach((item, index) => {

        const viewerId = "viewer_" + index;

        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${item.codigo}</td>
            <td>${item.elemento}</td>
            <td>${item.ifc_type}</td>
            <td>${item.descripcion}</td>
            <td>${item.lod}</td>
            <td><canvas id="${viewerId}" class="viewer"></canvas></td>
        `;

        tabla.appendChild(fila);

        crearViewer(viewerId, item.ifc_path);

    });

}

function crearViewer(canvasId, ifcPath)
{

    const viewer = new Viewer({
        canvasId: canvasId
    });

    viewer.scene.camera.eye = [10, 10, 10];
    viewer.scene.camera.look = [0, 0, 0];
    viewer.scene.camera.up = [0, 0, 1];

    // xeokit carga IFC directamente
    fetch(ifcPath)
    .then(res => res.arrayBuffer())
    .then(data => {
        console.log("IFC cargado:", ifcPath);
    });

}

iniciar();

</script>

</body>
</html>

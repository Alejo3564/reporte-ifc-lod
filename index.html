<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reporte IFC LOD</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #222636;
    --border: #2e3347;
    --accent: #3b82f6;
    --accent2: #10b981;
    --text: #e2e8f0;
    --text-muted: #64748b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 32px;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  header .logo { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  header h1 { font-size: 17px; font-weight: 600; letter-spacing: -0.3px; }
  header .sep { width: 1px; height: 22px; background: var(--border); }

  .main-container { padding: 28px 32px; max-width: 1600px; margin: 0 auto; }

  .filtros-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
    margin-bottom: 20px;
  }
  .filtro-group { display: flex; flex-direction: column; gap: 4px; }
  .filtro-group label { font-size: 10px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); }
  .filtro-group select {
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 5px; font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13px; cursor: pointer; min-width: 130px; outline: none; transition: border-color 0.15s;
  }
  .filtro-group select:focus { border-color: var(--accent); }
  .btn-clear {
    background: transparent; border: 1px solid var(--border); color: var(--text-muted);
    padding: 7px 14px; border-radius: 5px; font-family: 'IBM Plex Sans', sans-serif;
    font-size: 12px; cursor: pointer; transition: all 0.15s;
  }
  .btn-clear:hover { border-color: var(--accent); color: var(--accent); }
  .count-badge { margin-left: auto; font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--text-muted); }

  .table-wrapper { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  table { border-collapse: collapse; width: 100%; }
  thead { background: var(--surface2); border-bottom: 2px solid var(--border); }
  th { padding: 12px 16px; text-align: left; font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: var(--text-muted); white-space: nowrap; }
  tbody tr { border-bottom: 1px solid var(--border); transition: background 0.1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--surface2); }
  td { padding: 14px 16px; font-size: 13px; vertical-align: middle; }
  td.codigo { font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: var(--accent); }
  td.ifc-type { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent2); }

  .lod-badge { display: inline-block; padding: 2px 8px; border-radius: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; font-weight: 600; }
  .lod-200 { background: rgba(245,158,11,0.12); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
  .lod-300 { background: rgba(16,185,129,0.12); color: #10b981; border: 1px solid rgba(16,185,129,0.3); }
  .lod-400 { background: rgba(59,130,246,0.12); color: #3b82f6; border: 1px solid rgba(59,130,246,0.3); }
  .lod-500 { background: rgba(168,85,247,0.12); color: #a855f7; border: 1px solid rgba(168,85,247,0.3); }

  .viewer-cell { width: 380px; padding: 10px 16px; }
  .viewer-container {
    position: relative; width: 350px; height: 240px;
    border-radius: 6px; overflow: hidden; background: #080a12;
    border: 1px solid var(--border);
  }
  .viewer-container canvas { width: 100% !important; height: 100% !important; display: block; }
  .viewer-loading {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px;
    background: #080a12; z-index: 10; transition: opacity 0.4s;
  }
  .viewer-loading.hidden { opacity: 0; pointer-events: none; }
  .spinner { width: 22px; height: 22px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
  .viewer-loading span { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--text-muted); letter-spacing: 1px; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .props-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-top: 20px; }
  .props-panel h3 { font-size: 10px; font-family: 'IBM Plex Mono', monospace; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 14px; }
  .props-grid { display: flex; gap: 32px; flex-wrap: wrap; }
  .prop-item { display: flex; flex-direction: column; gap: 4px; }
  .prop-label { font-size: 10px; font-family: 'IBM Plex Mono', monospace; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
  .prop-value { font-size: 14px; font-weight: 500; }
  .prop-value.mono { font-family: 'IBM Plex Mono', monospace; color: var(--accent2); }
  .empty-state { padding: 48px; text-align: center; color: var(--text-muted); font-size: 13px; display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">BIM Smart Tools</div>
  <div class="sep"></div>
  <h1>Reporte LOD — Objetos IFC</h1>
</header>

<div class="main-container">
  <div class="filtros-bar">
    <div class="filtro-group"><label>Código</label><select id="filtroCodigo" onchange="filtrar()"><option value="">Todos</option></select></div>
    <div class="filtro-group"><label>Elemento</label><select id="filtroElemento" onchange="filtrar()"><option value="">Todos</option></select></div>
    <div class="filtro-group"><label>IFC Type</label><select id="filtroIfcType" onchange="filtrar()"><option value="">Todos</option></select></div>
    <div class="filtro-group"><label>LOD</label><select id="filtroLOD" onchange="filtrar()"><option value="">Todos</option></select></div>
    <button class="btn-clear" onclick="limpiarFiltros()">✕ Limpiar</button>
    <span class="count-badge" id="countBadge"></span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Código</th><th>Elemento</th><th>IFC Type</th><th>Descripción</th><th>LOD</th><th>Modelo 3D (IFC)</th>
        </tr>
      </thead>
      <tbody id="tablaBody"></tbody>
    </table>
    <div class="empty-state" id="emptyState">No hay resultados para los filtros aplicados.</div>
  </div>

  <div class="props-panel">
    <h3>Elemento seleccionado</h3>
    <div class="props-grid">
      <div class="prop-item"><span class="prop-label">IFC Type</span><span class="prop-value mono" id="propIfcType">—</span></div>
      <div class="prop-item"><span class="prop-label">Nombre</span><span class="prop-value" id="propNombre">—</span></div>
      <div class="prop-item"><span class="prop-label">Express ID</span><span class="prop-value" id="propId">—</span></div>
    </div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.152.2/build/three.module.js",
    "three/examples/jsm/controls/OrbitControls": "https://unpkg.com/three@0.152.2/examples/jsm/controls/OrbitControls.js",
    "three/examples/jsm/loaders/GLTFLoader": "https://unpkg.com/three@0.152.2/examples/jsm/loaders/GLTFLoader.js",
    "stats.js/src/Stats.js": "https://unpkg.com/stats.js@0.17.0/src/Stats.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/examples/jsm/controls/OrbitControls";

// web-ifc cargado desde CDN como módulo ES
// Usamos IfcLoader de three-stdlib para máxima compatibilidad en GitHub Pages
// ─── Alternativa robusta: usar IFCLoader de three/addons directamente ───────

// Cargamos web-ifc-three que expone IfcLoader como ES module limpio
const { IFCLoader } = await import("https://unpkg.com/web-ifc-three@0.0.136/IFCLoader.js");

// ─── ESTADO GLOBAL ───────────────────────────────────────────────────────────
let datosGlobal = [];
const renderers  = {};  // id → { renderer, scene, camera, controls, animId }

// ─── INICIAR ─────────────────────────────────────────────────────────────────
async function iniciar() {
  const resp = await fetch("./data/datos.json?v=" + Date.now());
  datosGlobal = await resp.json();
  llenarDropdowns();
  renderTabla(datosGlobal);
}

// ─── DROPDOWNS ───────────────────────────────────────────────────────────────
function llenarDropdowns() {
  llenarDropdown("filtroCodigo",   [...new Set(datosGlobal.map(x => x.codigo))]);
  llenarDropdown("filtroElemento", [...new Set(datosGlobal.map(x => x.elemento))]);
  llenarDropdown("filtroIfcType",  [...new Set(datosGlobal.map(x => x.ifc_type))]);
  llenarDropdown("filtroLOD",      [...new Set(datosGlobal.map(x => x.lod))]);
}
function llenarDropdown(id, valores) {
  const sel = document.getElementById(id);
  valores.sort().forEach(v => { const o = document.createElement("option"); o.value = o.text = v; sel.appendChild(o); });
}

// ─── RENDER TABLA ─────────────────────────────────────────────────────────────
function renderTabla(datos) {
  const tbody = document.getElementById("tablaBody");
  document.getElementById("emptyState").style.display = datos.length === 0 ? "block" : "none";
  document.getElementById("countBadge").textContent = `${datos.length} elemento${datos.length !== 1 ? 's' : ''}`;

  // Destruir renders anteriores
  Object.values(renderers).forEach(r => {
    cancelAnimationFrame(r.animId);
    r.renderer.dispose();
  });
  Object.keys(renderers).forEach(k => delete renderers[k]);

  tbody.innerHTML = "";

  datos.forEach((item, idx) => {
    const lodClass = `lod-${item.lod}`;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="codigo">${item.codigo}</td>
      <td>${item.elemento}</td>
      <td class="ifc-type">${item.ifc_type}</td>
      <td>${item.descripcion}</td>
      <td><span class="lod-badge ${lodClass}">LOD ${item.lod}</span></td>
      <td class="viewer-cell">
        <div class="viewer-container" id="cont_${idx}">
          <canvas id="cv_${idx}"></canvas>
          <div class="viewer-loading" id="load_${idx}">
            <div class="spinner"></div>
            <span>Cargando IFC…</span>
          </div>
        </div>
      </td>`;
    tbody.appendChild(tr);
    setTimeout(() => crearViewer(idx, item.ifc_path), 100 + idx * 150);
  });
}

// ─── CREAR VIEWER THREE.js + IFCLoader ───────────────────────────────────────
async function crearViewer(idx, ifcPath) {
  const container = document.getElementById(`cont_${idx}`);
  const canvas    = document.getElementById(`cv_${idx}`);
  if (!container || !canvas) return;

  const W = container.clientWidth  || 350;
  const H = container.clientHeight || 240;

  // --- Renderer ---
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setSize(W, H);
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setClearColor(0x080a12, 1);

  // --- Scene ---
  const scene = new THREE.Scene();
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dirLight = new THREE.DirectionalLight(0xffffff, 1);
  dirLight.position.set(10, 20, 10);
  scene.add(dirLight);

  // --- Camera ---
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 10000);
  camera.position.set(10, 10, 10);

  // --- Controls ---
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;

  // --- IFCLoader ---
  const ifcLoader = new IFCLoader();
  await ifcLoader.ifcManager.setWasmPath("https://unpkg.com/web-ifc@0.0.36/");

  renderers[`cv_${idx}`] = { renderer, scene, camera, controls, animId: null };

  // --- Animate loop ---
  const animate = () => {
    renderers[`cv_${idx}`].animId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  };
  animate();

  // --- Cargar IFC ---
  try {
    ifcLoader.load(ifcPath, (ifcModel) => {
      scene.add(ifcModel);

      // Centrar cámara en el modelo
      const box    = new THREE.Box3().setFromObject(ifcModel);
      const center = box.getCenter(new THREE.Vector3());
      const size   = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);

      camera.position.copy(center).add(new THREE.Vector3(maxDim, maxDim * 0.8, maxDim));
      controls.target.copy(center);
      controls.update();

      // Ocultar spinner
      const loadEl = document.getElementById(`load_${idx}`);
      if (loadEl) loadEl.classList.add("hidden");
    },
    undefined,  // onProgress
    (err) => {
      console.error(`Error IFC [${ifcPath}]:`, err);
      mostrarError(idx, ifcPath);
    });
  } catch(e) {
    mostrarError(idx, ifcPath);
  }
}

function mostrarError(idx, ifcPath) {
  const loadEl = document.getElementById(`load_${idx}`);
  if (loadEl) loadEl.innerHTML = `<span style="color:#ef4444;font-size:10px;font-family:'IBM Plex Mono',monospace;text-align:center;padding:8px;">Error al cargar<br>${ifcPath.split('/').pop()}</span>`;
}

// ─── FILTRAR / LIMPIAR ───────────────────────────────────────────────────────
window.filtrar = function() {
  const c = document.getElementById("filtroCodigo").value;
  const e = document.getElementById("filtroElemento").value;
  const t = document.getElementById("filtroIfcType").value;
  const l = document.getElementById("filtroLOD").value;
  renderTabla(datosGlobal.filter(item =>
    (!c || item.codigo === c) && (!e || item.elemento === e) &&
    (!t || item.ifc_type === t) && (!l || item.lod === l)
  ));
};

window.limpiarFiltros = function() {
  ["filtroCodigo","filtroElemento","filtroIfcType","filtroLOD"].forEach(id => document.getElementById(id).value = "");
  renderTabla(datosGlobal);
};

iniciar();
</script>
</body>
</html>

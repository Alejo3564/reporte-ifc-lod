<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Reporte IFC LOD</title>

<style>

body {
    font-family: Arial;
    margin: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
}

.viewer {
    width: 400px;
    height: 300px;
}

</style>

</head>

<body>

<h2>Reporte LOD Objetos IFC</h2>

<table>

<thead>
<tr>
<th>Codigo</th>
<th>Elemento</th>
<th>IFC Type</th>
<th>Descripción</th>
<th>LOD</th>
<th>Modelo IFC</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>


<script type="module">

import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.152.2/build/three.module.js";

import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.152.2/examples/jsm/controls/OrbitControls.js";

import { IFCLoader } from "https://cdn.jsdelivr.net/npm/web-ifc-three@0.0.126/IFCLoader.js";


async function iniciar()
{

    const tabla = document.getElementById("tabla");

    const response = await fetch("./data/datos.json");

    const datos = await response.json();

    datos.forEach((item, index) => {

        const viewerId = "viewer_" + index;

        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${item.codigo}</td>
            <td>${item.elemento}</td>
            <td>${item.ifc_type}</td>
            <td>${item.descripcion}</td>
            <td>${item.lod}</td>
            <td><div id="${viewerId}" class="viewer"></div></td>
        `;

        tabla.appendChild(fila);

        crearViewer(viewerId, item.ifc_path);

    });

}


function crearViewer(containerId, ifcPath)
{

    const container = document.getElementById(containerId);

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
        75,
        container.clientWidth / container.clientHeight,
        0.1,
        1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(container.clientWidth, container.clientHeight);

    container.appendChild(renderer.domElement);


    const controls = new OrbitControls(camera, renderer.domElement);

    const light = new THREE.DirectionalLight(0xffffff, 1);

    light.position.set(10, 10, 10);

    scene.add(light);


    const loader = new IFCLoader();

    loader.load(ifcPath, function(model)
    {

        scene.add(model);

    });


    camera.position.z = 10;


    function animate()
    {

        requestAnimationFrame(animate);

        controls.update();

        renderer.render(scene, camera);

    }

    animate();

}


iniciar();

</script>


</body>
</html>

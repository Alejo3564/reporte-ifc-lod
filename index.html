<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Reporte IFC LOD</title>

<style>

body {
    font-family: Arial;
    margin: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
}

.viewer {
    width: 400px;
    height: 300px;
}

</style>

</head>

<body>

<h2>Reporte LOD Objetos IFC</h2>

<table>

<thead>
<tr>
<th>Codigo</th>
<th>Elemento</th>
<th>IFC Type</th>
<th>Descripción</th>
<th>LOD</th>
<th>Modelo IFC</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>


<script type="module">

import {
    Viewer,
    XKTLoaderPlugin
} from "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk/dist/xeokit-sdk.es.js";


async function iniciar()
{

    const tabla = document.getElementById("tabla");

    const response = await fetch("./data/datos.json");

    const datos = await response.json();

    datos.forEach((item, index) => {

        const canvasId = "viewer_" + index;

        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${item.codigo}</td>
            <td>${item.elemento}</td>
            <td>${item.ifc_type}</td>
            <td>${item.descripcion}</td>
            <td>${item.lod}</td>
            <td>
                <canvas id="${canvasId}" class="viewer"></canvas>
            </td>
        `;

        tabla.appendChild(fila);

        crearViewer(canvasId, item.ifc_path);

    });

}


function crearViewer(canvasId, xktPath)
{

    const viewer = new Viewer({

        canvasId: canvasId,

        transparent: true

    });


    viewer.scene.camera.eye = [10, 10, 10];

    viewer.scene.camera.look = [0, 0, 0];

    viewer.scene.camera.up = [0, 0, 1];


    viewer.scene.cameraControl.panToPointer = true;


    const loader = new XKTLoaderPlugin(viewer);


    loader.load({

        id: "modelo",

        src: xktPath,

        edges: true

    });


}


iniciar();

</script>


</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<title>Reporte IFC LOD</title>

<style>

body {
    font-family: Arial;
    margin: 20px;
}

table {
    border-collapse: collapse;
    width: 100%;
}

th, td {
    border: 1px solid #ccc;
    padding: 6px;
}

.viewer {
    width: 400px;
    height: 300px;
    border: 1px solid #999;
}

#propiedades {
    margin-top: 20px;
    padding: 10px;
    border: 1px solid #999;
    width: 400px;
}

.filtros {
    margin-bottom: 15px;
}

.filtros select, .filtros button {
    margin-right: 10px;
    padding: 5px;
}

</style>

</head>

<body>

<h2>Reporte LOD Objetos IFC</h2>


<div class="filtros">

<label>Código:</label>
<select id="filtroCodigo" onchange="filtrar()">
<option value="">Todos</option>
</select>

<label>Elemento:</label>
<select id="filtroElemento" onchange="filtrar()">
<option value="">Todos</option>
</select>

<label>IFC Type:</label>
<select id="filtroIfcType" onchange="filtrar()">
<option value="">Todos</option>
</select>

<label>LOD:</label>
<select id="filtroLOD" onchange="filtrar()">
<option value="">Todos</option>
</select>

<button onclick="limpiarFiltros()">Limpiar filtros</button>

</div>


<table>

<thead>
<tr>
<th>Codigo</th>
<th>Elemento</th>
<th>IFC Type</th>
<th>Descripción</th>
<th>LOD</th>
<th>Modelo IFC</th>
</tr>
</thead>

<tbody id="tablaBody"></tbody>

</table>


<h3>Propiedades del elemento seleccionado</h3>
<div id="propiedades">
IfcType: <span id="ifcType">Ninguno</span>
</div>


<script type="module">

import {
    Viewer,
    XKTLoaderPlugin
} from "https://cdn.jsdelivr.net/npm/@xeokit/xeokit-sdk/dist/xeokit-sdk.es.js";


let datosGlobal = [];


// INICIAR
async function iniciar()
{
    const response = await fetch("./data/datos.json?v=" + Date.now());

    datosGlobal = await response.json();

    llenarDropdowns();

    renderTabla(datosGlobal);
}


// LLENAR DROPDOWNS
function llenarDropdowns()
{
    llenarDropdown("filtroCodigo", [...new Set(datosGlobal.map(x => x.codigo))]);

    llenarDropdown("filtroElemento", [...new Set(datosGlobal.map(x => x.elemento))]);

    llenarDropdown("filtroIfcType", [...new Set(datosGlobal.map(x => x.ifc_type))]);

    llenarDropdown("filtroLOD", [...new Set(datosGlobal.map(x => x.lod))]);
}


function llenarDropdown(id, valores)
{
    const select = document.getElementById(id);

    valores.sort().forEach(valor =>
    {
        const option = document.createElement("option");

        option.value = valor;

        option.text = valor;

        select.appendChild(option);
    });
}


// RENDER TABLA
function renderTabla(datos)
{
    const tabla = document.getElementById("tablaBody");

    tabla.innerHTML = "";

    datos.forEach((item, index) =>
    {
        const canvasId = "viewer_" + index;

        const fila = document.createElement("tr");

        fila.innerHTML = `
            <td>${item.codigo}</td>
            <td>${item.elemento}</td>
            <td>${item.ifc_type}</td>
            <td>${item.descripcion}</td>
            <td>${item.lod}</td>
            <td><canvas id="${canvasId}" class="viewer"></canvas></td>
        `;

        tabla.appendChild(fila);

        crearViewer(canvasId, item.ifc_path);
    });
}


// CREAR VISOR
function crearViewer(canvasId, xktPath)
{
    const viewer = new Viewer({
        canvasId: canvasId
    });

    const loader = new XKTLoaderPlugin(viewer);

    const model = loader.load({
        src: xktPath,
        edges: true
    });

    model.on("loaded", () =>
    {
        viewer.cameraFlight.flyTo({
            aabb: viewer.scene.aabb
        });
    });

    viewer.scene.input.on("mouseclicked", (coords) =>
    {
        const hit = viewer.scene.pick({
            canvasPos: coords
        });

        if (hit && hit.entity)
        {
            const ifcType = hit.entity.metaObject?.type || "No disponible";

            document.getElementById("ifcType").innerText = ifcType;
        }
    });
}


// FILTRAR
window.filtrar = function()
{
    const codigo = document.getElementById("filtroCodigo").value;

    const elemento = document.getElementById("filtroElemento").value;

    const ifcType = document.getElementById("filtroIfcType").value;

    const lod = document.getElementById("filtroLOD").value;


    const filtrados = datosGlobal.filter(item =>
        (!codigo || item.codigo === codigo) &&
        (!elemento || item.elemento === elemento) &&
        (!ifcType || item.ifc_type === ifcType) &&
        (!lod || item.lod === lod)
    );

    renderTabla(filtrados);
}


// LIMPIAR FILTROS
window.limpiarFiltros = function()
{
    document.getElementById("filtroCodigo").value = "";

    document.getElementById("filtroElemento").value = "";

    document.getElementById("filtroIfcType").value = "";

    document.getElementById("filtroLOD").value = "";

    renderTabla(datosGlobal);
}


iniciar();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nivel de Desarrollo LOG</title>
<link rel="icon" href="data:,">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    /* Egis Corporate Colors */
    --midnight-500: #08212C;
    --midnight-400: #344A54;
    --midnight-300: #61747C;
    --midnight-200: #8D9DA4;
    --midnight-100: #BAC7CC;
    --midnight-050: #EFF4F5;

    --vert-500:  #ABC022;
    --vert-400:  #BED13E;
    --vert-300:  #C9D76A;
    --vert-200:  #D8E28F;
    --vert-100:  #E7EEB3;
    --vert-600:  #91A41A;

    --azure-500: #0099A5;
    --azure-400: #2EABB5;
    --azure-300: #5CBDC5;
    --azure-200: #8AD0D4;
    --azure-100: #B8E2E4;
    --azure-600: #00858E;

    --gray-500: #5D848A;
    --gray-400: #789A9F;

    /* UI vars */
    --bg:       #f0f4f5;
    --surface:  #ffffff;
    --surface2: #f5f8f9;
    --border:   #dce6e8;
    --text:     #08212C;
    --muted:    #61747C;
    --accent:   #0099A5;
    --accent2:  #ABC022;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── HEADER ── */
  header {
    background: var(--midnight-500);
    padding: 0 28px;
    display: flex;
    align-items: center;
    gap: 0;
    height: 52px;
    border-bottom: 3px solid var(--vert-500);
  }

  .header-logo {
    display: flex;
    align-items: center;
    padding-right: 20px;
    border-right: 1px solid var(--midnight-300);
    height: 100%;
  }

  .header-logo img {
    height: 28px;
    width: auto;
    display: block;
  }

  header h1 {
    font-size: 14px;
    font-weight: 500;
    color: var(--midnight-100);
    padding-left: 20px;
    letter-spacing: 0.2px;
  }

  header h1 strong {
    color: #fff;
    font-weight: 600;
  }

  /* ── MAIN ── */
  .main { padding: 24px 28px; max-width: 1600px; margin: 0 auto; }

  /* ── FILTROS ── */
  .filtros-bar {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 18px;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    align-items: flex-end;
    margin-bottom: 16px;
    box-shadow: 0 1px 3px rgba(8,33,44,.06);
  }

  .fg { display: flex; flex-direction: column; gap: 4px; position: relative; }

  .fg label {
    font-size: 10px;
    font-family: 'JetBrains Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    font-weight: 500;
  }

  .fg .si {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 7px 10px;
    border-radius: 6px;
    font-size: 13px;
    min-width: 155px;
    outline: none;
    font-family: 'Inter', sans-serif;
    transition: border-color .15s, box-shadow .15s;
  }

  .fg .si:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,153,165,.12);
  }

  .fg .si::placeholder { color: var(--midnight-200); }

  .drop {
    position: absolute;
    top: calc(100% + 2px);
    left: 0; right: 0;
    background: var(--surface);
    border: 1px solid var(--accent);
    border-radius: 6px;
    max-height: 220px;
    overflow-y: auto;
    z-index: 9999;
    display: none;
    box-shadow: 0 6px 20px rgba(8,33,44,.12);
  }

  .drop.open { display: block; }

  .di {
    padding: 8px 10px;
    font-size: 13px;
    cursor: pointer;
    color: var(--text);
    border-bottom: 1px solid var(--border);
  }
  .di:last-child { border-bottom: none; }
  .di:hover, .di.sel { background: var(--azure-500); color: #fff; }
  .di.rst { color: var(--muted); font-style: italic; }

  .btn-clear {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 7px 14px;
    border-radius: 6px;
    font-size: 12px;
    cursor: pointer;
    font-family: 'Inter', sans-serif;
    transition: all .15s;
  }
  .btn-clear:hover { border-color: var(--accent); color: var(--accent); background: rgba(0,153,165,.06); }

  .count {
    margin-left: auto;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    background: var(--surface2);
    padding: 4px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
  }

  /* ── TABLA ── */
  .table-wrapper {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 1px 3px rgba(8,33,44,.06);
  }

  table { border-collapse: collapse; width: 100%; }

  thead {
    background: var(--midnight-500);
  }

  th {
    padding: 11px 16px;
    text-align: left;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    color: var(--midnight-100);
    white-space: nowrap;
  }

  tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: #f0f8f9; }

  td { padding: 13px 16px; font-size: 13px; vertical-align: middle; color: var(--text); }

  td.cod {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--azure-600);
    font-weight: 500;
  }

  td.itype {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--midnight-300);
  }

  /* LOD badges */
  .lod {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 4px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 500;
  }
  .lod-200 { background: rgba(171,192,34,.15); color: #6a7a00; border: 1px solid rgba(171,192,34,.4); }
  .lod-300 { background: rgba(0,153,165,.12); color: var(--azure-600); border: 1px solid rgba(0,153,165,.35); }
  .lod-400 { background: rgba(8,33,44,.1); color: var(--midnight-400); border: 1px solid rgba(8,33,44,.25); }
  .lod-500 { background: rgba(93,132,138,.15); color: var(--gray-500); border: 1px solid rgba(93,132,138,.35); }

  /* bSDD link */
  .bsdd-link {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 10px;
    border-radius: 5px;
    font-size: 11px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 500;
    color: #fff;
    background: var(--azure-500);
    text-decoration: none;
    border: none;
    white-space: nowrap;
    transition: background .15s;
  }
  .bsdd-link:hover { background: var(--azure-600); }

  /* ── VIEWER ── */
  .vc { width: 380px; padding: 8px 14px; }

  .vbox {
    position: relative;
    width: 350px;
    height: 230px;
    border-radius: 6px;
    overflow: hidden;
    background: var(--midnight-500);
    border: 1px solid var(--midnight-400);
  }

  .vbox canvas { width: 100% !important; height: 100% !important; display: block; }

  .vload {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: var(--midnight-500);
    z-index: 10;
    transition: opacity .4s;
  }
  .vload.gone { opacity: 0; pointer-events: none; }

  .spin {
    width: 22px; height: 22px;
    border: 2px solid var(--midnight-300);
    border-top-color: var(--vert-500);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }

  .vload span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--midnight-200);
    letter-spacing: 0.5px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    padding: 48px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    display: none;
  }
</style>
</head>
<body>

<header>
  <div class="header-logo">
    <img src="https://i.postimg.cc/v4G3KFyG/Logotype-Vert.png" alt="Egis">
  </div>
  <h1><strong>Nivel de Desarrollo LOG</strong></h1>
</header>

<div class="main">
  <div class="filtros-bar">
    <div class="fg">
      <label>Codigo</label>
      <input class="si" id="fCod" type="text" placeholder="Buscar..." autocomplete="off">
      <div class="drop" id="drop-cod"></div>
    </div>
    <div class="fg">
      <label>Elemento</label>
      <input class="si" id="fEle" type="text" placeholder="Buscar..." autocomplete="off">
      <div class="drop" id="drop-ele"></div>
    </div>
    <div class="fg">
      <label>IFC Type</label>
      <input class="si" id="fIfc" type="text" placeholder="Buscar..." autocomplete="off">
      <div class="drop" id="drop-ifc"></div>
    </div>
    <div class="fg">
      <label>LOD</label>
      <input class="si" id="fLod" type="text" placeholder="Buscar..." autocomplete="off">
      <div class="drop" id="drop-lod"></div>
    </div>
    <button class="btn-clear" id="btnLimpiar">✕ Limpiar</button>
    <span class="count" id="cnt"></span>
  </div>

  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th>Codigo</th>
          <th>Elemento</th>
          <th>IFC Type</th>
          <th>Descripcion</th>
          <th>LOD</th>
          <th>bSDD</th>
          <th>Modelo 3D (IFC)</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty">No hay resultados para los filtros aplicados.</div>
  </div>
</div>

<script type="module" src="bundle.js"></script>
</body>
</html>
